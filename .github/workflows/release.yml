name: release

# Pushing a tag like v1.0.1 builds the app, signs it, publishes a GitHub
# Release, and adds the release to the Sparkle appcast on gh-pages. Installed
# copies read that appcast through SUFeedURL.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  APP: dd/Build/Products/Release/DynamicNotch.app

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: derive versions
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r X Y Z <<< "$VERSION"
          # sparkle compares this monotonically increasing build number
          BUILD=$((X * 10000 + Y * 100 + Z))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # The certificate lives in a keychain made for this run and deleted after it,
      # rather than in the login keychain, so nothing survives the runner. The
      # password is generated here: it protects a keychain that exists for minutes
      # and is never written down.
      - name: import signing certificate
        id: keychain
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # codesign runs without a prompt only if it is allowed to use the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed 's/.*"\(.*\)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "no Developer ID Application identity in the imported certificate" >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: build
        run: |
          set -o pipefail
          xcodebuild \
            -project DynamicNotch.xcodeproj \
            -scheme DynamicNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath dd \
            MARKETING_VERSION=${{ steps.v.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.v.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -20

      # Xcode builds without a signature, and this script signs everything afterward,
      # the same way scripts/build-signed.sh does on a Mac.
      - name: sign the app
        run: >
          ./scripts/sign-nested.sh "$APP"
          "${{ steps.keychain.outputs.identity }}"
          "${{ steps.keychain.outputs.keychain }}"
          DynamicNotch/Application/DynamicNotch.entitlements

      # Every executable in the bundle has to carry the certificate, or notarization
      # refuses the whole thing. This says so before Apple does.
      - name: verify the signature
        id: app
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"

          if ! codesign -dvv "$APP" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            echo "the app is not signed with a Developer ID certificate" >&2
            exit 1
          fi

          # get-task-allow is the debug entitlement and notarization rejects it
          if codesign -d --entitlements :- "$APP" 2>/dev/null \
            | grep -q get-task-allow; then
            echo "the build carries get-task-allow" >&2
            exit 1
          fi

          find "$APP" -type f | while read -r f; do
            if file -b "$f" | grep -q 'Mach-O' \
              && ! codesign -dvv "$f" 2>&1 | grep -q 'Authority=Developer ID Application'; then
              echo "not signed with the Developer ID certificate: $f" >&2
              exit 1
            fi
          done

          echo "minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" >> "$GITHUB_OUTPUT"

      # Notarized before the zip and the dmg are made, since both have to carry the
      # stapled ticket. A stapled app opens without asking Apple at launch.
      - name: notarize
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait --timeout 45m

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          rm -f "$RUNNER_TEMP/key.p8" "$RUNNER_TEMP/notarize.zip"

      # the zip is what Sparkle downloads; the dmg is what people download
      - name: archive
        run: ditto -c -k --sequesterRsrc --keepParent "$APP" "DynamicNotch-${{ steps.v.outputs.version }}.zip"

      - name: disk image
        run: ./scripts/make-dmg.sh "$APP" "${{ steps.v.outputs.version }}" "DynamicNotch-${{ steps.v.outputs.version }}.dmg"

      # The app inside is signed and stapled already, and the image needs its own
      # signature and its own ticket: a download carries the quarantine bit on the image,
      # so that is what macOS checks first, before anything is copied out of it.
      - name: sign the disk image
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          DMG="DynamicNotch-${{ steps.v.outputs.version }}.dmg"

          codesign --force --sign "${{ steps.keychain.outputs.identity }}" \
            --timestamp \
            --keychain "${{ steps.keychain.outputs.keychain }}" \
            "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"

          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/dmgkey.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/dmgkey.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait --timeout 45m
          rm -f "$RUNNER_TEMP/dmgkey.p8"

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # what a download is judged by, rather than the execute assessment the app gets
          spctl --assess --type open \
            --context context:primary-signature --verbose=2 "$DMG"

      - name: sign
        id: sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: node scripts/sign-release.js "DynamicNotch-${{ steps.v.outputs.version }}.zip" >> "$GITHUB_OUTPUT"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=notes.md
          if [ -f "docs/release-notes/${{ steps.v.outputs.version }}.md" ]; then
            cp "docs/release-notes/${{ steps.v.outputs.version }}.md" "$NOTES"
          else
            echo "DynamicNotch ${{ steps.v.outputs.version }}." > "$NOTES"
          fi
          cp "$NOTES" appcast-notes.md
          printf '\n\n## Install\n\nOpen the dmg and drag DynamicNotch to Applications. Requires macOS %s or later.\n' \
            "${{ steps.app.outputs.minimum }}" >> "$NOTES"
          gh release create "$GITHUB_REF_NAME" \
            "DynamicNotch-${{ steps.v.outputs.version }}.dmg" \
            "DynamicNotch-${{ steps.v.outputs.version }}.zip" \
            --title "DynamicNotch ${{ steps.v.outputs.version }}" \
            --notes-file "$NOTES"

      # deleted whether the run passed or failed, so a cancelled release leaves no
      # certificate behind on the runner
      - name: remove the keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "${{ steps.keychain.outputs.keychain }}" || true

      - name: update appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git fetch origin gh-pages && git worktree add pages origin/gh-pages || {
            git worktree add --detach pages
            cd pages && git checkout --orphan gh-pages && git rm -rfq . && cd ..
          }
          node scripts/update-appcast.js pages/updates.xml.rss \
            "${{ steps.v.outputs.version }}" \
            "${{ steps.v.outputs.build }}" \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/DynamicNotch-${{ steps.v.outputs.version }}.zip" \
            "${{ steps.sign.outputs.length }}" \
            "${{ steps.sign.outputs.signature }}" \
            "${{ steps.app.outputs.minimum }}" \
            "appcast-notes.md"
          cd pages
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            add updates.xml.rss
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "appcast: ${{ steps.v.outputs.version }}"
          git push origin HEAD:gh-pages
